# Official NINA plugin build & release workflow
# Based on https://github.com/isbeorn/nina.plugin.manifests/blob/main/tools/github-action.yaml
#
# Triggers when you push a tag matching a version number (e.g. "1.2.0.0")
# 1) Builds the plugin in Release mode
# 2) Uses the official CreateManifest.ps1 to generate manifest + archive from the DLL metadata
# 3) Creates a GitHub Release with the zip + manifest attached
# 4) If you have a fork of nina.plugin.manifests with a PAT secret, auto-creates a PR
#
# Setup:
#   - Fork https://github.com/isbeorn/nina.plugin.manifests (keep the same repo name)
#   - Create a Personal Access Token with write access to that fork
#   - Add the PAT as a repository secret named "PAT" in your plugin repo

name: Build and Release

on:
  push:
    tags:
      # GitHub tag filters use glob syntax, not regular expressions.  The
      # previous `[0-9]+` form looked like regex but matched a literal `+`, so
      # ordinary four-part version tags never started this workflow.
      - '[0-9]*.[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLUGIN_NAME: "AI Weather"
  PLUGIN_SLN_NAME: "AIWeather"
  PLUGIN_DLL_NAME: "NINA.Plugin.AIWeather"
  PLUGIN_MANIFEST_PATH: "a/aiweather"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          mkdir packages
          mkdir "packages/${{ env.PLUGIN_NAME }}"

      - name: Build .NET Assemblies
        run: |
          dotnet restore
          dotnet build "${{ env.PLUGIN_SLN_NAME }}.csproj" -c Release -p:PostBuildEvent= -p:Version=${{ github.ref_name }} -o ./bin/Release

      # Copy all build output (DLL + dependencies) into packages folder.
      # This plugin has NuGet dependencies (Emgu.CV, LibVLCSharp, etc.) that must ship.
      - name: Prepare package
        run: |
          $packageRoot = "packages/${{ env.PLUGIN_NAME }}"
          Copy-Item "bin/Release/*" $packageRoot -Force -Recurse

          # N.I.N.A. 3.x and this plugin are x64-only. NuGet copies native
          # assets for every supported OS/architecture (including iOS,
          # Android, Linux, macOS, Windows x86/ARM64 and 32-bit LibVLC) into
          # the class-library output. Shipping all of them adds roughly
          # 475 MiB without providing anything N.I.N.A. can load.
          foreach ($nativeRoot in @("runtimes", "libvlc")) {
            $nativePath = Join-Path $packageRoot $nativeRoot
            if (-not (Test-Path (Join-Path $nativePath "win-x64"))) {
              throw "Required $nativeRoot/win-x64 runtime is missing"
            }

            Get-ChildItem $nativePath -Directory |
              Where-Object Name -ne "win-x64" |
              Remove-Item -Recurse -Force
          }

          $packageBytes = (Get-ChildItem $packageRoot -File -Recurse |
            Measure-Object Length -Sum).Sum
          $packageLimit = 260MB
          if ($packageBytes -gt $packageLimit) {
            throw ("Prepared package is {0:N2} MiB; the 260 MiB unpacked-size guard prevents accidental multi-platform/environment packaging" -f ($packageBytes / 1MB))
          }
          Write-Host ("Prepared x64-only package: {0:N2} MiB" -f ($packageBytes / 1MB))

      - name: Create Plugin archives and manifests
        run: |
          curl -LO https://raw.githubusercontent.com/isbeorn/nina.plugin.manifests/main/tools/CreateManifest.ps1
          pwsh CreateManifest.ps1 -file "packages/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_DLL_NAME }}.dll" -installerUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip" -createArchive -includeAll
          # Add -beta flag above if you want the manifest on the Beta channel
          Rename-Item -Path "manifest.json" -NewName "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json"
          Rename-Item -Path "${{ env.PLUGIN_DLL_NAME }}.zip" -NewName "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip"

          $archive = Get-Item "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip"
          $archiveLimit = 180MB
          if ($archive.Length -gt $archiveLimit) {
            throw ("Release archive is {0:N2} MiB; the 180 MiB guard prevents accidental environment/cache packaging" -f ($archive.Length / 1MB))
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName).Entries
          $forbidden = $entries | Where-Object {
            $_.FullName -match '(^|/)(bin|obj|packages|dataset|datasets|checkpoints|runs|wandb)/' -or
            ($_.FullName -match '(^|/)(runtimes|libvlc)/([^/]+)/' -and $Matches[3] -ne 'win-x64')
          }
          if ($forbidden) {
            throw "Release archive contains forbidden build, training, or non-x64 runtime paths: $($forbidden.FullName -join ', ')"
          }
          Write-Host ("Audited release archive: {0:N2} MiB, {1} entries" -f ($archive.Length / 1MB), $entries.Count)

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-manifest
          path: ${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json

  check-repo-exists:
    runs-on: ubuntu-latest
    needs: build-and-release
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if manifest fork exists
        id: check
        run: |
          REPO="nina.plugin.manifests"
          OWNER="${{ github.repository_owner }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/$OWNER/$REPO)
          if [ "$STATUS" -eq 200 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  publish-manifest:
    runs-on: ubuntu-latest
    needs: [check-repo-exists, build-and-release]
    if: needs.check-repo-exists.outputs.exists == 'true'
    steps:
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-manifest

      - name: Sanitize PLUGIN_NAME
        run: echo "PLUGIN_NAME_SANITIZED=${PLUGIN_NAME//[[:space:]]/}" >> $GITHUB_ENV

      - name: Clone manifest fork
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository_owner }}/nina.plugin.manifests.git
          cd nina.plugin.manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Base only the new PR branch on upstream, without rewriting the fork's main.
          git remote add upstream https://github.com/isbeorn/nina.plugin.manifests.git
          git fetch upstream main
          git checkout -b "${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }}" upstream/main

      - name: Copy manifest file
        run: |
          NINA_VER="3.0.0.0"
          DEST="./nina.plugin.manifests/manifests/${{ env.PLUGIN_MANIFEST_PATH }}/${NINA_VER}/${{ github.ref_name }}"
          mkdir -p "${DEST}"
          cp "./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json" "${DEST}/manifest.json"
          cd nina.plugin.manifests
          # ── REMOVE THE OLD PLUGIN IF IT EXISTS ──
          # This ensures we don't have duplicates in the repository after identifier change
          if [ -d "manifests/n/nina.plugin.aiweather" ]; then
            echo "Deleting old plugin entry: manifests/n/nina.plugin.aiweather"
            git rm -r --cached "manifests/n/nina.plugin.aiweather"
            rm -rf "manifests/n/nina.plugin.aiweather"
          fi

          git add .
          git commit -m "Add manifest for release ${{ github.ref_name }} (replaces old identifier)"
          git push origin "${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }}"

      - name: Create pull request
        shell: bash
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token
          gh pr create \
            --title "Add manifest for ${{ env.PLUGIN_NAME }} ${{ github.ref_name }}" \
            --body "Automatically generated manifest for release ${{ github.ref_name }}" \
            --head ${{ github.repository_owner }}:${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }} \
            --base main \
            --repo isbeorn/nina.plugin.manifests
